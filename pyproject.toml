[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wahlap-telegram-bot"
version = "0.1.0"
description = "Use maiserver from Telegram to get player QR codes and maimai DX NET links."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[socks]>=22.8,<23",
    "aiohttp>=3.12,<4",
    "aiosqlite>=0.21,<1",
    "qrcode[pil]>=8.2,<9",
    "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1", "zxing-cpp>=2.3,<4"]

[project.scripts]
wahlap-bot = "wahlap_bot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wahlap_bot = ["static/*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
